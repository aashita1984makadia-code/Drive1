<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Files - Cloud Drive</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">☁ <span>Cloud Drive</span></div>
  <div class="top-actions">
    <span id="userName"></span>
    <button id="logout" class="secondary">Logout</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button id="uploadBtn" class="primary">＋ Upload files</button>
    <button id="newFolderBtn" class="secondary wide">＋ New folder</button>
    <nav>
      <a class="active">📁 My Files</a>
    </nav>
    <div class="storage">
      <b>Storage</b>
      <div class="progress"><i id="storageBar"></i></div>
      <small id="storageText">Calculating...</small>
    </div>
  </aside>

  <section class="content">
    <div class="toolbar">
      <div>
        <h2>My Files</h2>
        <div id="breadcrumb" class="crumb">/</div>
      </div>
      <input id="search" class="search" placeholder="Search files...">
    </div>

    <div id="dropzone" class="dropzone">
      <strong>Drop files here</strong> or tap Upload
    </div>

    <input id="fileInput" type="file" multiple hidden>
    <div id="message"></div>
    <div id="fileList" class="file-list"></div>
  </section>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
